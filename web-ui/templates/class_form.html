<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiko-lite web-ui - Class Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>kiko-lite web-ui</h1>
        <div class="header-right">
            <a href="/" class="btn-secondary btn-sm">← Back</a>
            <span class="user-name">admin</span>
            <button class="btn-secondary btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <main style="max-width: 500px; margin: 0 auto; padding: 1.5rem;">
        <h2 id="page-title">Add Class</h2>

        <form id="form-class" method="POST">
            <div class="form-row">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" id="f-class-name" placeholder="VOICE" required>
            </div>
            <div class="form-row">
                <label>Keyword <span class="required">*</span></label>
                <input type="text" name="keyword" id="f-class-keyword" placeholder="voice" required>
            </div>
            <div class="form-row">
                <label>Role</label>
                <input type="text" name="role" id="f-class-role" placeholder="Voice models">
            </div>
            <div class="form-row">
                <label>Sort</label>
                <input type="number" name="sort" id="f-class-sort" value="100" min="1">
            </div>

            <div class="modal-actions" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end;">
                <a href="/" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save</button>
            </div>
        </form>
    </main>

    <script type="module">
        import { apiGet, apiPost } from '/static/core/api.js';
        import { showError } from '/static/core/auth.js';

        const urlParams = new URLSearchParams(window.location.search);
        const editName = urlParams.get('edit');
        const isEdit = !!editName;

        document.getElementById('page-title').textContent = isEdit ? 'Edit Class' : 'Add Class';
        if (isEdit) {
            loadClass(editName);
        }

        async function loadClass(name) {
            try {
                const data = await apiGet('/classes/' + encodeURIComponent(name));
                document.getElementById('f-class-name').value = data.name;
                document.getElementById('f-class-name').readOnly = true;
                document.getElementById('f-class-keyword').value = data.keyword;
                document.getElementById('f-class-role').value = data.role || '';
                document.getElementById('f-class-sort').value = data.sort || 100;
            } catch (e) {
                showError('Failed to load class: ' + e.message);
            }
        }

        document.getElementById('form-class').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);
            data.name = data.name.toUpperCase();
            data.keyword = data.keyword.toLowerCase();
            data.sort = parseInt(data.sort) || 100;

            try {
                await apiPost('/classes', data);
                window.location.href = '/';
            } catch (e) {
                showError('Failed to save class: ' + e.message);
            }
        });
    </script>
</body>
</html>
