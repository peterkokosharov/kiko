<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiko-lite web-ui - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h2>kiko-lite web-ui</h2>
            <form id="form-login" method="POST">
                <div class="form-row">
                    <label>Username</label>
                    <input type="text" name="username" value="admin" required autocomplete="username">
                </div>
                <div class="form-row">
                    <label>Password</label>
                    <input type="password" name="password" required autocomplete="current-password">
                </div>
                <div class="form-row login-error" id="login-error"></div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/static/pages/login.js"></script>
</body>
</html>
