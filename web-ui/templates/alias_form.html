<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiko-lite web-ui - Alias Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>kiko-lite web-ui</h1>
        <div class="header-right">
            <a href="/" class="btn-secondary btn-sm">← Back</a>
            <span class="user-name">admin</span>
            <button class="btn-secondary btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <main style="max-width: 500px; margin: 0 auto; padding: 1.5rem;">
        <h2>Add Alias</h2>

        <form id="form-alias" method="POST">
            <div class="form-row">
                <label>Glob Pattern <span class="required">*</span></label>
                <input type="text" name="glob" id="f-alias-glob" placeholder="claude-*" required>
            </div>
            <div class="form-row">
                <label>Target Model <span class="required">*</span></label>
                <input type="text" name="target" id="f-alias-target" placeholder="gemini-flash" required>
            </div>

            <div class="modal-actions" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end;">
                <a href="/" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save</button>
            </div>
        </form>
    </main>

    <script type="module">
        import { apiPost } from '/static/core/api.js';
        import { showError } from '/static/core/auth.js';

        document.getElementById('form-alias').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);

            try {
                await apiPost('/aliases', data);
                window.location.href = '/';
            } catch (e) {
                showError('Failed to save alias: ' + e.message);
            }
        });
    </script>
</body>
</html>
