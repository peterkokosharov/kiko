<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiko-lite web-ui - Alias Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>kiko-lite web-ui</h1>
        <div class="header-right">
            <a href="/" class="btn-secondary btn-sm">← Back</a>
            <span class="user-name">admin</span>
            <button class="btn-secondary btn-sm" data-logout>Logout</button>
        </div>
    </header>

    <main class="page-main page-main-500">
        <h2>Add Alias</h2>

        <form id="form-alias" method="POST">
            <div class="form-row">
                <label>Glob Pattern <span class="required">*</span></label>
                <input type="text" name="glob" id="f-alias-glob" placeholder="claude-*" required>
            </div>
            <div class="form-row">
                <label>Target Model <span class="required">*</span></label>
                <input type="text" name="target" id="f-alias-target" placeholder="gemini-flash" required>
            </div>

            <div class="modal-actions form-actions">
                <a href="/" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save</button>
            </div>
        </form>
    </main>

    <script type="module" src="/static/pages/alias_form.js"></script>
</body>
</html>
