[Application]
name=KIKO
version=0.2.0
publisher=Peter Kokosharov
; Entry point: kiko proxy server (console app)
entry_point=litellm.proxy.kiko_server:run_server
console=true
; No icon yet — add: icon=assets\kiko.ico

[Python]
version=3.12.7
bitness=64

[Include]
; Local wheels — copy both into local/kiko/dist/ before building
local_wheels=dist\kiko-0.2.0-py3-none-any.whl

; Runtime dependencies (pynsist downloads these from PyPI)
packages=fastapi
    uvicorn
    pyyaml
    anyio
    starlette
    click
    h11
    httptools
    uvloop

; Extra files bundled into the installer
files=kiko-sample.yaml
    commands.txt
    releases\kiko-w-0.2.0.zip

[Build]
; Output goes to build\nsis\
nsi_template=

[Shortcut KIKO Proxy]
entry_point=litellm.proxy.kiko_server:run_server
console=true
