# SPDX-License-Identifier: MIT
# Builds the native Windows tray (tray/win + tray/common) and uploads win-kiko-tray.zip as an artifact.
name: win-tray

on:
  workflow_dispatch:
  push:
    paths:
      - "tray/**"
      - ".github/workflows/win-tray.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S tray -B build -A x64 -DKT_FETCH_CJSON=OFF

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path win-kiko-tray | Out-Null
          Copy-Item build/Release/kiko-tray.exe win-kiko-tray/
          Copy-Item LICENSE win-kiko-tray/
          @'
          kiko-tray for Windows (native tray icon)

          Start: double-click kiko-tray.exe. A tray icon appears; right-click it for the menu
          (status, start/stop, dialogs).

          Portable: nothing is installed and nothing is written to the registry.
          Delete this folder and it is gone.

          Runtime needs (not included, Python is not bundled):
          - Start needs a configured command: "command" in kiko-tray.ini (next to the exe) or the
            environment variable KIKO_TRAY_COMMAND (it wins). There is no default; without one,
            Start only shows a message. kiko-tray.ini keys: command, port (default 4000),
            token_file (the management API token; %USERPROFILE% and %APPDATA% are expanded).
          - Stop ends the whole process tree the tray started (Job Object). A kiko started outside
            the tray is never stopped by the tray. Quitting the tray also ends what it started.
          - If kiko is already running, the tray only watches it.
          - The API token comes from KIKO_API_TOKEN, the ini token_file, or %USERPROFILE%\.kiko\api-token.

          License: see LICENSE (MIT).
          '@ | Set-Content -Encoding utf8 win-kiko-tray/README.txt
          Compress-Archive -Path win-kiko-tray -DestinationPath win-kiko-tray.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-kiko-tray
          path: win-kiko-tray.zip
          if-no-files-found: error
