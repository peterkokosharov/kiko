<script id="md" type="application/json">"# \u041a\u043b\u0430\u0441\u043e\u0432\u0435 \u043c\u043e\u0434\u0435\u043b\u0438\n\n## \u0418\u0434\u0435\u044f\u0442\u0430\n\n\u041a\u043b\u0438\u0435\u043d\u0442\u044a\u0442 \u043d\u0435 \u043d\u0430\u0437\u043e\u0432\u0430\u0432\u0430 \u043c\u043e\u0434\u0435\u043b \u043d\u0430 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u0435\u043d \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a. \u0422\u043e\u0439 \u043d\u0430\u0437\u043e\u0432\u0430\u0432\u0430 **\u043a\u043b\u0430\u0441**, \u0430 kiko-lite \u0438\u0437\u0431\u0438\u0440\u0430 \u043c\u043e\u0434\u0435\u043b \u043e\u0442 \u0442\u043e\u0437\u0438 \u043a\u043b\u0430\u0441.\n\u041a\u043b\u0430\u0441\u044a\u0442 \u0435 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u043d\u0430 \u0440\u0430\u0431\u043e\u0442\u0430, \u043d\u0435 \u043c\u0430\u0440\u043a\u0430. Claude Code \u0432\u0435\u0447\u0435 \u043f\u043e\u043b\u0437\u0432\u0430 \u0442\u0440\u0438 \u0438\u043c\u0435\u043d\u0430 \u043d\u0430 \u043a\u043b\u0430\u0441\u043e\u0432\u0435 (opus, sonnet, haiku) \u0432\n\u043d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438\u0442\u0435 \u0441\u0438 \u0437\u0430 \u043c\u043e\u0434\u0435\u043b, \u0437\u0430\u0442\u043e\u0432\u0430 kiko-lite \u0433\u0438 \u043f\u0440\u0435\u0438\u0437\u043f\u043e\u043b\u0437\u0432\u0430: \u0430\u0433\u0435\u043d\u0442\u043d\u0430\u0442\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430 roni \u043d\u0430 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u0438\u043a\u0430 \u043a\u0430\u0437\u0432\u0430 \u0441\u0430\u043c\u043e \u201e\u0442\u0430\u0437\u0438\n\u0437\u0430\u0434\u0430\u0447\u0430 \u0438\u0441\u043a\u0430 SONNET\", \u0430 \u0440\u0443\u0442\u0435\u0440\u044a\u0442 \u0440\u0435\u0448\u0430\u0432\u0430 \u043a\u043e\u0439 \u0440\u0435\u0430\u043b\u0435\u043d \u043c\u043e\u0434\u0435\u043b \u0435 \u0442\u043e\u0439 \u0434\u043d\u0435\u0441.\n\n| \u041a\u043b\u0430\u0441 | \u0420\u043e\u043b\u044f | \u0417\u043d\u0430\u0447\u0435\u043d\u0438\u0435 |\n|---|---|---|\n| HAIKU | \u0440\u0430\u0431\u043e\u0442\u043d\u0438\u043a | \u043c\u0430\u0441\u043e\u0432\u0430 \u043f\u0440\u043e\u0441\u0442\u0430 \u0440\u0430\u0431\u043e\u0442\u0430, \u0435\u0432\u0442\u0438\u043d\u0430 \u0438 \u0431\u044a\u0440\u0437\u0430 |\n| SONNET | \u043c\u0430\u0439\u0441\u0442\u043e\u0440 | \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u0442\u0430 \u0440\u0430\u0431\u043e\u0442\u0430 \u043f\u043e \u0438\u0437\u043f\u044a\u043b\u043d\u0435\u043d\u0438\u0435\u0442\u043e |\n| OPUS | \u043c\u0435\u043d\u0438\u0434\u0436\u044a\u0440 \u0438 \u043e\u0446\u0435\u043d\u0438\u0442\u0435\u043b \u043d\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u0442\u0430 | \u043f\u043b\u0430\u043d\u0438\u0440\u0430, \u043f\u0440\u0435\u0433\u043b\u0435\u0436\u0434\u0430, \u043f\u0440\u0435\u0446\u0435\u043d\u044f\u0432\u0430 \u0440\u0435\u0437\u0443\u043b\u0442\u0430\u0442\u0430 |\n| FABLE | \u0432\u044a\u043d\u0448\u0435\u043d \u043e\u0434\u0438\u0442\u043e\u0440 | \u0434\u0440\u0443\u0433 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a \u0433\u043b\u0435\u0434\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u0442\u0430; \u0440\u044f\u0434\u043a\u043e \u0438 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e |\n\n\u0422\u0435\u0437\u0438 \u0447\u0435\u0442\u0438\u0440\u0438 \u0441\u0435 \u0437\u0430\u0440\u0435\u0436\u0434\u0430\u0442 \u043f\u0440\u0435\u0434\u0432\u0430\u0440\u0438\u0442\u0435\u043b\u043d\u043e \u0432 \u0431\u0430\u0437\u0430\u0442\u0430 (`DEFAULT_CLASSES` \u0432 `kiko_lite/db.py`).\n\n## \u0421\u0435\u0433\u0430\u0448\u043d\u0430\u0442\u0430 \u043a\u0430\u0440\u0442\u0430 \u043d\u0430 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u0438\u043a\u0430\n\n| \u041a\u043b\u0430\u0441 | \u041c\u043e\u0434\u0435\u043b \u0434\u043d\u0435\u0441 |\n|---|---|\n| OPUS | Gemini Flash \u0438\u043b\u0438 GPT-6 |\n| SONNET | NVIDIA Nemotron Ultra (\u0431\u0435\u0437\u043f\u043b\u0430\u0442\u043d\u043e \u043d\u0438\u0432\u043e) |\n| HAIKU | Gemini flash-lite |\n| FABLE | GPT-6 (\u0440\u044f\u0434\u043a\u043e \u043f\u043e\u043b\u0437\u0432\u0430\u043d) |\n\n\u0422\u043e\u0432\u0430 \u0435 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044f, \u043d\u0435 \u043a\u043e\u0434: \u043f\u0440\u043e\u043c\u0435\u043d\u0435\u0442\u0435 \u0440\u0435\u0434 \u0432 \u0442\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430 `models` \u0438 \u0441\u043b\u0435\u0434\u0432\u0430\u0449\u0430\u0442\u0430 \u0437\u0430\u044f\u0432\u043a\u0430 \u044f \u0441\u043b\u0435\u0434\u0432\u0430. \u0422\u043e\u0447\u043d\u0438\u0442\u0435 \u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440\u0438\n\u043d\u0430 \u043c\u043e\u0434\u0435\u043b\u0438\u0442\u0435 \u043d\u0435 \u0441\u0430 \u0438\u0437\u0431\u0440\u043e\u0435\u043d\u0438 \u0442\u0443\u043a, \u0437\u0430\u0449\u043e\u0442\u043e \u0441\u0435 \u043c\u0435\u043d\u044f\u0442; \u0432\u0438\u0436\u0442\u0435 `python -m kiko_lite list-models`.\n\n## \u041a\u0430\u043a \u0438\u043c\u0435\u0442\u043e \u0432 \u0437\u0430\u044f\u0432\u043a\u0430\u0442\u0430 \u0441\u0442\u0430\u0432\u0430 \u043c\u043e\u0434\u0435\u043b (\u0440\u0435\u0434 \u043d\u0430 \u0440\u0435\u0437\u043e\u043b\u0432\u044a\u0440\u0430)\n\n`DBResolver.__call__` \u0432 `kiko_lite/resolver.py` \u043f\u0440\u043e\u0431\u0432\u0430 \u043f\u043e \u0440\u0435\u0434:\n\n1. **Alias \u0433\u043b\u043e\u0431\u043e\u0432\u0435 \u0432 \u0431\u0430\u0437\u0430\u0442\u0430** (\u0442\u0430\u0431\u043b\u0438\u0446\u0430 `aliases`, \u0448\u0430\u0431\u043b\u043e\u043d `fnmatch` \u043a\u044a\u043c \u0446\u0435\u043b; \u043f\u0435\u0447\u0435\u043b\u0438 \u043f\u044a\u0440\u0432\u043e\u0442\u043e \u0441\u044a\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u0435).\n2. **\u041a\u043b\u044e\u0447\u043e\u0432\u0430 \u0434\u0443\u043c\u0430 \u043d\u0430 \u043a\u043b\u0430\u0441**: \u0432 \u043f\u043e\u0438\u0441\u043a\u0430\u043d\u043e\u0442\u043e \u0438\u043c\u0435 (\u0441 \u043c\u0430\u043b\u043a\u0438 \u0431\u0443\u043a\u0432\u0438) \u0441\u0435 \u0442\u044a\u0440\u0441\u0438 \u043a\u043b\u044e\u0447\u043e\u0432\u0430\u0442\u0430 \u0434\u0443\u043c\u0430 \u043d\u0430 \u0432\u0441\u0435\u043a\u0438 \u043a\u043b\u0430\u0441 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440\n   `claude-opus-4` \u0441\u044a\u0434\u044a\u0440\u0436\u0430 `opus`). \u041f\u043e\u043b\u0437\u0432\u0430 \u0441\u0435 \u043d\u0430\u0439-\u0434\u043e\u0431\u0440\u0438\u044f\u0442 \u0432\u043a\u043b\u044e\u0447\u0435\u043d \u043c\u043e\u0434\u0435\u043b \u043d\u0430 \u0442\u043e\u0437\u0438 \u043a\u043b\u0430\u0441: \u043f\u044a\u0440\u0432\u043e \u0441\u0442\u0430\u0442\u0443\u0441 `ok`, \u043f\u043e\u0441\u043b\u0435\n   `unknown`, \u043f\u043e\u0441\u043b\u0435 \u043d\u0430\u0439-\u043c\u0430\u043b\u044a\u043a `priority`, \u043f\u043e\u0441\u043b\u0435 \u043d\u0430\u0439-\u043c\u0430\u043b\u044a\u043a id (`Snapshot.best`).\n3. **\u0421\u0440\u0435\u0434\u0430**: `ANTHROPIC_DEFAULT_<CLASS>_MODEL` \u043d\u0430 \u0441\u044a\u0432\u043f\u0430\u0434\u043d\u0430\u043b\u0438\u044f \u043a\u043b\u0430\u0441, \u043f\u0440\u043e\u043c\u0435\u043d\u043b\u0438\u0432\u0430\u0442\u0430, \u043a\u043e\u044f\u0442\u043e \u0441\u0430\u043c\u0438\u044f\u0442 Claude Code \u043f\u043e\u043b\u0437\u0432\u0430, \u0437\u0430 \u0434\u0430 \u0438\u0437\u0431\u0438\u0440\u0430 \u043c\u043e\u0434\u0435\u043b\n   \u043f\u043e \u043a\u043b\u0430\u0441. \u0421\u0442\u043e\u0439\u043d\u043e\u0441\u0442\u0442\u0430 \u045d \u0435 alias \u0438\u043b\u0438 `provider/model-id`.\n4. \u0421\u0430\u043c\u043e\u0442\u043e \u0438\u043c\u0435, \u043a\u0430\u0442\u043e alias \u0438\u043b\u0438 \u0434\u0438\u0440\u0435\u043a\u0442\u043d\u043e `provider/model-id`.\n\n```mermaid\nflowchart TD\n    REQ[\"\u041a\u043b\u0438\u0435\u043d\u0442\u044a\u0442 \u0438\u0441\u043a\u0430 \u0438\u043c\u0435 \u043d\u0430 \u043c\u043e\u0434\u0435\u043b\"] --> A{\"\u0421\u044a\u0432\u043f\u0430\u0434\u0430 \u043b\u0438 alias \u0433\u043b\u043e\u0431 \u0432 \u0431\u0430\u0437\u0430\u0442\u0430?\"}\n    A -->|\u0434\u0430| TGT[\"\u0446\u0435\u043b\u0435\u0432\u0438 \u043c\u043e\u0434\u0435\u043b\"]\n    A -->|\u043d\u0435| K{\"\u0418\u043c\u0430 \u043b\u0438 \u043a\u043b\u044e\u0447\u043e\u0432\u0430 \u0434\u0443\u043c\u0430 \u043d\u0430 \u043a\u043b\u0430\u0441 \u0432 \u0438\u043c\u0435\u0442\u043e?\"}\n    K -->|\u0434\u0430| B{\"\u0418\u043c\u0430 \u043b\u0438 \u043a\u043b\u0430\u0441\u044a\u0442 \u0438\u0437\u043f\u043e\u043b\u0437\u0432\u0430\u0435\u043c \u0432\u043a\u043b\u044e\u0447\u0435\u043d \u043c\u043e\u0434\u0435\u043b?\"}\n    B -->|\u0434\u0430| PICK[\"best - status ok, \u043f\u043e\u0441\u043b\u0435 unknown; \u043d\u0430\u0439-\u043c\u0430\u043b\u044a\u043a priority\"]\n    B -->|\u043d\u0435| E{\"\u0417\u0430\u0434\u0430\u0434\u0435\u043d\u0430 \u043b\u0438 \u0435 \u0441\u0440\u0435\u0434\u0430 ANTHROPIC_DEFAULT_CLASS_MODEL?\"}\n    K -->|\u043d\u0435| N\n    E -->|\u0434\u0430| TGT\n    E -->|\u043d\u0435| N[\"\u043f\u043e\u043b\u0437\u0432\u0430 \u0441\u0435 \u0438\u043c\u0435\u0442\u043e \u043a\u0430\u0442\u043e alias \u0438\u043b\u0438 provider/model-id\"]\n    PICK --> TGT\n    N --> TGT\n    TGT --> UP[\"\u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a + \u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440 \u043d\u0430 \u043c\u043e\u0434\u0435\u043b\u0430 \u043f\u0440\u0438 \u043d\u0435\u0433\u043e\"]\n```\n\n## \u041a\u043b\u0430\u0441\u043e\u0432\u0435\u0442\u0435 \u0441\u0430 \u0434\u0430\u043d\u043d\u0438\n\n\u041a\u043b\u0430\u0441\u043e\u0432\u0435\u0442\u0435 \u0436\u0438\u0432\u0435\u044f\u0442 \u0432 SQLite \u0442\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430 `model_classes` (\u0432\u0435\u0440\u0441\u0438\u044f \u043d\u0430 \u0441\u0445\u0435\u043c\u0430\u0442\u0430 2): `name`, `keyword`, `role`, `sort`.\n\n```\npython -m kiko_lite list-classes\npython -m kiko_lite add-class VOICE --keyword voice --role \"speech output\"\npython -m kiko_lite add-model my-model --provider gemini/<model-id> --api-key-env GEMINI_API_KEY --class VOICE\n```\n\n\u041f\u0440\u0430\u0432\u0438\u043b\u0430, \u043d\u0430\u043b\u043e\u0436\u0435\u043d\u0438 \u043e\u0442 `Database.add_class`: \u0438\u043c\u0435\u0442\u043e \u0435 \u0441 \u0433\u043b\u0430\u0432\u043d\u0438 \u0431\u0443\u043a\u0432\u0438 (`^[A-Z][A-Z0-9_]{0,31}$`), \u043a\u043b\u044e\u0447\u043e\u0432\u0430\u0442\u0430 \u0434\u0443\u043c\u0430 \u0435 \u0441 \u043c\u0430\u043b\u043a\u0438\n\u0431\u0443\u043a\u0432\u0438, \u043e\u0442 3 \u0434\u043e 64 \u0437\u043d\u0430\u043a\u0430, \u0438 \u043d\u0438\u043a\u043e\u044f \u043a\u043b\u044e\u0447\u043e\u0432\u0430 \u0434\u0443\u043c\u0430 \u043d\u0435 \u043c\u043e\u0436\u0435 \u0434\u0430 \u0441\u044a\u0434\u044a\u0440\u0436\u0430 \u0434\u0440\u0443\u0433\u0430 (\u043e\u0442\u043a\u0440\u0438\u0432\u0430\u043d\u0435\u0442\u043e \u0435 \u043f\u044a\u0440\u0432\u043e \u0441\u044a\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u0435 \u043d\u0430 \u043f\u043e\u0434\u043d\u0438\u0437,\n\u0442\u0430\u043a\u0430 \u0447\u0435 \u043f\u0440\u0438\u043f\u043e\u043a\u0440\u0438\u0432\u0430\u0449\u0438 \u0441\u0435 \u043a\u043b\u044e\u0447\u043e\u0432\u0438 \u0434\u0443\u043c\u0438 \u0431\u0438\u0445\u0430 \u0441\u043a\u0440\u0438\u043b\u0438 \u043a\u043b\u0430\u0441).\n\n### \u041a\u043b\u0430\u0441\u043e\u0432\u0435: \u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u0438 \u0438 \u043a\u0430\u043d\u0434\u0438\u0434\u0430\u0442\u0438\n\n| \u0421\u0442\u0430\u0442\u0443\u0441 | \u041a\u043b\u0430\u0441\u043e\u0432\u0435 |\n|---|---|\n| \u041f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u0438 | VOICE, EYES (\u0432\u0436. [\u041f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u0438 \u043a\u043b\u0430\u0441\u043e\u0432\u0435](MODEL-CLASSES.md#planned-classes)) |\n| \u041a\u0430\u043d\u0434\u0438\u0434\u0430\u0442\u0438 | \u0432\u0436. [\u041f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u0438 \u043a\u043b\u0430\u0441\u043e\u0432\u0435](MODEL-CLASSES.md#planned-classes) |\n\n\u0417\u0430\u0431\u0435\u043b\u0435\u0436\u043a\u0430: \u0434\u043d\u0435\u0441 kiko-lite \u043e\u0431\u0441\u043b\u0443\u0436\u0432\u0430 \u0441\u0430\u043c\u043e \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u0430\u0442\u0430 \u043a\u0440\u0430\u0439\u043d\u0430 \u0442\u043e\u0447\u043a\u0430 \u043d\u0430 Anthropic (`/v1/messages`,\n`/v1/messages/count_tokens`). \u041a\u043b\u0430\u0441\u043e\u0432\u0435\u0442\u0435 \u0437\u0430 \u0434\u0440\u0443\u0433\u0438 \u043c\u0435\u0434\u0438\u0438 \u043f\u044a\u0440\u0432\u043e \u0441\u0435 \u043d\u0443\u0436\u0434\u0430\u044f\u0442 \u043e\u0442 \u0434\u0440\u0443\u0433\u0438 \u043a\u0440\u0430\u0439\u043d\u0438 \u0442\u043e\u0447\u043a\u0438 \u0438 \u043f\u0440\u0435\u0432\u043e\u0434\u0430\u0447\u0438; \u0442\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430\n\u0435 \u0433\u043e\u0442\u043e\u0432\u0430, \u043a\u0440\u0430\u0439\u043d\u0438\u0442\u0435 \u0442\u043e\u0447\u043a\u0438 \u043d\u0435 \u0441\u0430.\n\n<a id=\"planned-classes\"><\/a>\n\n## \u041f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u0438 \u043a\u043b\u0430\u0441\u043e\u0432\u0435\n\n\u041f\u044a\u043b\u043d\u0438\u044f\u0442 \u0441\u043f\u0438\u0441\u044a\u043a \u0441 \u043a\u043b\u0430\u0441\u043e\u0432\u0435, \u043a\u043e\u0438\u0442\u043e \u043e\u0447\u0430\u043a\u0432\u0430\u043c\u0435 \u0434\u0430 \u0434\u043e\u0431\u0430\u0432\u0438\u043c. \u041a\u043e\u043b\u043e\u043d\u0430\u0442\u0430 \u201e\u0412\u0438\u0434\" \u043a\u0430\u0437\u0432\u0430 \u0434\u0430\u043b\u0438 \u043a\u043b\u0430\u0441\u044a\u0442 \u0435 \u0435\u0437\u0438\u043a\u043e\u0432 \u043c\u043e\u0434\u0435\u043b (LLM) \u0438 \u043a\u0430\u043a\u0432\u0430 \u0444\u043e\u0440\u043c\u0430 \u043d\u0430 API \u043c\u0443 \u0442\u0440\u044f\u0431\u0432\u0430.\n\n| \u041a\u043b\u0430\u0441 | \u041a\u0430\u043a\u0432\u043e \u043f\u0440\u0430\u0432\u0438 | \u0412\u0438\u0434 (\u0444\u043e\u0440\u043c\u0430 \u043d\u0430 API) | \u041f\u0440\u0438\u043c\u0435\u0440\u043d\u0 \u043b\u0430\u0441 \u0434\u043e \u0438\u0437\u0431\u0440\u0430\u043d \u0436\u0438\u0432 \u043c\u043e\u0434\u0435\u043b\n\n```mermaid\nflowchart LR\n    C[\"\u041a\u043b\u0430\u0441, \u043d\u0430\u043f\u0440. SONNET\"] --> M1[\"\u041a\u0430\u043d\u0434\u0438\u0434\u0430\u0442 1 (priority 10)\"]\n    C --> M2[\"\u041a\u0430\u043d\u0434\u0438\u0434\u0430\u0442 2 (priority 20)\"]\n    C --> M3[\"\u041a\u0430\u043d\u0434\u0438\u0434\u0430\u0442 3 (priority 100)\"]\n    M1 --> AL{\"\u0416\u0438\u0432 \u043b\u0438 \u0435?\"}\n    M2 --> AL\n    M3 --> AL\n    AL -->|\"status ok \u0438\u043b\u0438 unknown, \u0432\u043a\u043b\u044e\u0447\u0435\u043d\"| CH[\"\u0418\u0437\u0431\u0440\u0430\u043d \u043c\u043e\u0434\u0435\u043b\"]\n    AL -->|\"\u0438\u0437\u043a\u043b\u044e\u0447\u0435\u043d, \u0431\u0435\u0437 \u043a\u043b\u044e\u0447 \u0438\u043b\u0438 \u043d\u0435 \u043c\u043e\u0436\u0435 \u0434\u0430 \u0441\u0435 \u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u0443\u0432\u0430\"| SKIP[\"\u043f\u0440\u0435\u0441\u043a\u043e\u0447\u0435\u043d\"]\n```\n\n\u0427\u0435\u0441\u0442\u043d\u043e \u0441\u044a\u0441\u0442\u043e\u044f\u043d\u0438\u0435: \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430\u0442\u0430 \u201e\u0436\u0438\u0432\" \u0434\u043d\u0435\u0441 \u0435 \u0441\u0430\u043c\u043e \u0442\u043e\u0432\u0430, \u043a\u043e\u0435\u0442\u043e \u0435 \u0432 \u0440\u0435\u0434\u0430 (`enabled`, `status`), \u043f\u043b\u044e\u0441 \u0434\u0430\u043b\u0438 \u0440\u0435\u0434\u044a\u0442 \u043c\u043e\u0436\u0435 \u0434\u0430 \u0441\u0435\n\u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u0443\u0432\u0430 \u043a\u044a\u043c \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a. \u041d\u0438\u0449\u043e \u0432 kiko-lite \u043e\u0449\u0435 \u043d\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0432\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u0430 \u0438 \u043d\u0435 \u0441\u043c\u0435\u043d\u044f `status` \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e; \u0442\u043e\u0432\u0430 \u0435\nwatchdog-\u044a\u0442 \u0432 [ROADMAP](ROADMAP.md).\n\n## \u041f\u043e-\u043a\u044a\u0441\u043d\u043e: \u0441\u0447\u0435\u0442\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f\u0442 (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e)\n\n\u0418\u0434\u0435\u044f, \u043d\u0435 \u0435 \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043d\u0430: \u201e\u0441\u0447\u0435\u0442\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\", \u043a\u043e\u0439\u0442\u043e \u0437\u043d\u0430\u0435 \u0446\u0435\u043d\u0438\u0442\u0435 \u0438 \u043b\u0438\u043c\u0438\u0442\u0438\u0442\u0435 \u043d\u0430 \u0431\u0435\u0437\u043f\u043b\u0430\u0442\u043d\u0438\u0442\u0435 \u043d\u0438\u0432\u0430 \u0438 \u043f\u0440\u0435\u0434\u043b\u0430\u0433\u0430 \u043d\u0430\u0439-\u0435\u0432\u0442\u0438\u043d\u0438\u044f \u0436\u0438\u0432\n\u043c\u043e\u0434\u0435\u043b \u0437\u0430 \u0434\u0430\u0434\u0435\u043d \u043a\u043b\u0430\u0441. \u0422\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430 \u0437\u0430 \u0444\u0430\u043a\u0442\u0443\u0440\u0438\u0440\u0430\u043d\u0435 \u0432\u0435\u0447\u0435 \u0437\u0430\u043f\u0438\u0441\u0432\u0430 \u0442\u043e\u043a\u0435\u043d\u0438 \u0438 \u0446\u0435\u043d\u0430 \u043d\u0430 \u0437\u0430\u044f\u0432\u043a\u0430, \u0430 `models` \u0438\u043c\u0430 \u043a\u043e\u043b\u043e\u043d\u0438 \u0437\u0430 \u0446\u0435\u043d\u0438, \u0442\u0430\u043a\u0430\n\u0447\u0435 \u0434\u0430\u043d\u043d\u0438\u0442\u0435 \u0437\u0430 \u043d\u0435\u0433\u043e \u0441\u0435 \u0441\u044a\u0431\u0438\u0440\u0430\u0442.\n"</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
const src = JSON.parse(document.getElementById("md").textContent);
const el = document.getElementById("content");
const r = new marked.Renderer();
r.code = (code, lang) => {
  const t = typeof code === "object" ? code.text : code, l = typeof code === "object" ? code.lang : lang;
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return l === "mermaid" ? '<pre class="mermaid">' + esc + "</pre>" : '<pre><code>' + esc + "</code></pre>";
};
el.innerHTML = marked.parse(src, {renderer: r});
el.querySelectorAll("a[href]").forEach(a => {
  const h = a.getAttribute("href");
  if (/^[A-Za-z0-9_-]+[.]md(#.*)?$/.test(h)) a.setAttribute("href", h.replace(".md", ".html"));
  else if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", "../" + h);  // the html is one folder deeper than the md
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "default"});
const pre = [...el.querySelectorAll("pre.mermaid")];
pre.forEach(p => { p.dataset.src = p.textContent; });
try {
  await mermaid.run({querySelector: "pre.mermaid"});
} catch (e) {
  console.error(e);
} finally {
  // scroll to the #anchor only now: the diagrams change the page height
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
}
// click to enlarge: the overlay always shows the light-theme diagram on white, so it is readable in dark mode too
const lb = document.getElementById("lb");
let n = 0;
pre.forEach(p => {
  const sv = p.querySelector("svg");
  if (!sv) return;
  sv.setAttribute("data-tip", "1");
  p.title = "кликни за уголемяване";
  sv.addEventListener("click", async () => {
    let svg = sv.outerHTML;
    if (dark) {
      try {
        mermaid.initialize({startOnLoad: false, theme: "default"});
        svg = (await mermaid.render("lbd" + (n++), p.dataset.src)).svg;
      } catch (e) {}
      mermaid.initialize({startOnLoad: false, theme: "dark"});
    }
    const t = document.createElement("div");
    t.innerHTML = svg;
    const c = t.querySelector("svg");
    c.removeAttribute("width"); c.removeAttribute("height"); c.style.removeProperty("max-width");
    if (!c.getAttribute("viewBox")) {
      const b = sv.getBBox(); c.setAttribute("viewBox", "0 0 " + b.width + " " + b.height);
    }
    lb.querySelector("svg")?.remove();
    lb.appendChild(c);
    lb.className = "on";
  });
});
lb.addEventListener("click", e => {
  if (e.detail === 1) setTimeout(() => { if (!lb.dataset.z) lb.className = ""; lb.dataset.z = ""; }, 250);
});
lb.addEventListener("dblclick", () => { lb.dataset.z = "1"; lb.className = lb.className === "on big" ? "on" : "on big"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.className = ""; });
</script></body></html>
