<script id="md" type="application/json">"# kiko-lite\n\nkiko-lite is a small \"model router\" for the home. It is written in plain Python (standard library only, Python 3.11+),\nstarts in well under a second and needs about 36 MB of memory.\n\nThe idea: a client such as **Claude Code**, or the owner's multi-agent system **roni**, does not ask for a vendor\nmodel. It asks for a model **class** (OPUS, SONNET, HAIKU, FABLE, and [more later](MODEL-CLASSES.md#planned-classes)) and kiko-lite gives it an alive\nmodel of that class from any vendor (Gemini, NVIDIA, Groq, Qwen, OpenAI-compatible endpoints).\n\n- **No vendor lock-in.** The client always speaks the Anthropic Messages API (`POST /v1/messages`); kiko-lite\n  translates it for the real provider and translates the streamed answer back.\n- **Free tiers for non-critical work.** The class map can point SONNET at a free NVIDIA model and HAIKU at a cheap\n  Gemini flash-lite, and keep the expensive model for the manager role.\n- **Small.** No third-party package at runtime: `http.client`, `ssl`, `http.server`, `sqlite3`, `json`.\n- **Secrets stay out of files.** API keys come from environment variables or the OS key store (Windows Credential\n  Manager, macOS Keychain, secret-tool, KWallet). The SQLite database only holds key NAMES.\n\nIt is the small sibling of \"kiko-full\", which is a LiteLLM fork with billing on top. See [NUMBERS](NUMBERS.md).\n\n## Quick start\n\nRun from the root of the exported tree (the folder that contains `kiko_lite/` and `kikolib/`):\n\n```\npython -m kiko_lite doctor                       # check the installation, never prints a secret\npython -m kiko_lite add-model gem-flash --provider gemini/<model-id> --api-key-env GEMINI_API_KEY --class OPUS\npython -m kiko_lite list-classes                 # OPUS, SONNET, HAIKU, FABLE ...\npython -m kiko_lite list-models\npython -m kiko_lite serve --no-auth              # home mode (or env KIKO_AUTH=none), 127.0.0.1:4000 (trusted network only)\n```\n\nThen point Claude Code at it:\n\n```\nset ANTHROPIC_BASE_URL=http://127.0.0.1:4000\nset ANTHROPIC_DEFAULT_OPUS_MODEL=<alias or provider/model-id>\n```\n\n`<model-id>` is a placeholder: use a model id that your provider really offers. The database is\n`~/.kiko/kiko.db` unless `--db` or env `KIKO_DB_PATH` says otherwise. Without `--no-auth` (or env `KIKO_AUTH=none`) the server needs a\n`MASTER_KEY` (env or key store) and clients send it as `x-api-key`.\n\n## Where things are\n\n| Page | Content |\n|---|---|\n| [ARCHITECTURE](ARCHITECTURE.md) | components, class diagram, one streaming request, deployment |\n| [MODEL-CLASSES](MODEL-CLASSES.md) | the class idea, roles, the owner's map, resolver order |\n| [ROADMAP](ROADMAP.md) | watchdog and failover, updatable providers, router target |\n| [NUMBERS](NUMBERS.md) | kiko-lite vs LiteLLM-based kiko-full, what was cut |\n| [CODE-TOUR](CODE-TOUR.md) | a guided tour with real code excerpts |\n\nSource folders in the exported tree:\n\n| Folder | Content |\n|---|---|\n| [kikolib/](../../../kikolib/) | the small standard-library toolkit (http, server, retry, keystore, ...) |\n| [kiko_lite/](../../../kiko_lite/) | the app: gateway, resolver, providers, SQLite, CLI |\n| [tests/kiko/](../../../tests/kiko/) | tests (the folder also holds older kiko-full tests) |\n| [tools/](../../../tools/) | helper scripts |\n| [docs/](../../../docs/) | older developer docs (mostly about kiko-full) |\n\nStatus: kiko-lite is young. Anything marked \"planned\" in these pages is not built yet.\n"</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
const src = JSON.parse(document.getElementById("md").textContent);
const el = document.getElementById("content");
const r = new marked.Renderer();
r.code = (code, lang) => {
  const t = typeof code === "object" ? code.text : code, l = typeof code === "object" ? code.lang : lang;
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return l === "mermaid" ? '<pre class="mermaid">' + esc + "</pre>" : '<pre><code>' + esc + "</code></pre>";
};
el.innerHTML = marked.parse(src, {renderer: r});
el.querySelectorAll("a[href]").forEach(a => {
  const h = a.getAttribute("href");
  if (/^[A-Za-z0-9_-]+[.]md(#.*)?$/.test(h)) a.setAttribute("href", h.replace(".md", ".html"));
  else if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", "../" + h);  // the html is one folder deeper than the md
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "default"});
const pre = [...el.querySelectorAll("pre.mermaid")];
pre.forEach(p => { p.dataset.src = p.textContent; });
try {
  await mermaid.run({querySelector: "pre.mermaid"});
} catch (e) {
  console.error(e);
} finally {
  // scroll to the #anchor only now: the diagrams change the page height
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
}
// click to enlarge: the overlay always shows the light-theme diagram on white, so it is readable in dark mode too
const lb = document.getElementById("lb");
let n = 0;
pre.forEach(p => {
  const sv = p.querySelector("svg");
  if (!sv) return;
  sv.setAttribute("data-tip", "1");
  p.title = "click to enlarge";
  sv.addEventListener("click", async () => {
    let svg = sv.outerHTML;
    if (dark) {
      try {
        mermaid.initialize({startOnLoad: false, theme: "default"});
        svg = (await mermaid.render("lbd" + (n++), p.dataset.src)).svg;
      } catch (e) {}
      mermaid.initialize({startOnLoad: false, theme: "dark"});
    }
    const t = document.createElement("div");
    t.innerHTML = svg;
    const c = t.querySelector("svg");
    c.removeAttribute("width"); c.removeAttribute("height"); c.style.removeProperty("max-width");
    if (!c.getAttribute("viewBox")) {
      const b = sv.getBBox(); c.setAttribute("viewBox", "0 0 " + b.width + " " + b.height);
    }
    lb.querySelector("svg")?.remove();
    lb.appendChild(c);
    lb.className = "on";
  });
});
lb.addEventListener("click", e => {
  if (e.detail === 1) setTimeout(() => { if (!lb.dataset.z) lb.className = ""; lb.dataset.z = ""; }, 250);
});
lb.addEventListener("dblclick", () => { lb.dataset.z = "1"; lb.className = lb.className === "on big" ? "on" : "on big"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.className = ""; });
</script></body></html>
