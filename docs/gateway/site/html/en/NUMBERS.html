<script id="md" type="application/json">"# Numbers\n\nkiko-lite against the LiteLLM-based kiko-full, measured on Windows, median of 3 runs.\n\n| Measure | kiko-lite | kiko-full (LiteLLM) |\n|---|---|---|\n| Working set | 36.0 MB | 223.2 MB |\n| Private memory | 22.3 MB | 204.1 MB |\n| Start time | 0.4 s | 6.3 s (cold start 13.5 s) |\n| Loaded modules | 214 | 2831 |\n\nFor comparison, a bare Python interpreter has a working set of 25.5 MB, so kiko-lite adds about 10 MB on top of it.\n\n```mermaid\nflowchart LR\n    subgraph FULL[\"kiko-full: LiteLLM + FastAPI + billing\"]\n        F1[\"223 MB working set\"]\n        F2[\"6.3 s start\"]\n        F3[\"2831 modules\"]\n    end\n    subgraph LITE[\"kiko-lite: standard library only\"]\n        L1[\"36 MB working set\"]\n        L2[\"0.4 s start\"]\n        L3[\"214 modules\"]\n    end\n    FULL -->|\"cut ~85% memory\"| LITE\n```\n\n## What was cut and why\n\nThe first plan (note of 2026-10-28) listed what to drop from LiteLLM. Summary, with the later changes marked.\n\n| Part of LiteLLM | What it does | Why dropped |\n|---|---|---|\n| 147 provider adapters (about 990 files) | talk to every vendor | the owner's providers speak OpenAI-compatible, or Gemini natively; a table entry replaces a folder |\n| Integrations (Langfuse, OpenTelemetry, Datadog, S3, Slack) | logging and alerts | we log to our own SQLite |\n| Proxy server (FastAPI, teams, budgets, Postgres, SSO, MCP) | admin and multi-user | replaced by `kikolib/server.py`; keys and caps are in SQLite |\n| Router, caching, scheduler | load balancing, Redis cache, queue | one user; failover will be our own, see [ROADMAP](ROADMAP.md) |\n| Other APIs (assistants, batches, files, images, rerank, ...) | feature endpoints | Claude Code uses only `/v1/messages` and `count_tokens` |\n| Extra routes (`/v1/chat/completions`, `/v1/embeddings`, ...) | translated routes | not in kiko-lite for now |\n| Admin UI (about 2,270 files) | dashboard | `doctor`, `costs` and SQLite instead |\n| LiteLLM tests (about 4,000 files) | tests of the above | gone with the code |\n| Heavy packages (httpx, aiohttp, openai, pydantic, fastapi, uvicorn, pyyaml, tiktoken, ...) | HTTP, server, config, tokens | replaced by `http.client`, `ssl`, `http.server`, `sqlite3`, `json`; token counts come from the provider `usage` |\n\n## What the old note says that is now outdated\n\nThe cut-list note was written before several decisions. Where it differs from the code, the code is right:\n\n- It says Gemini is reached through the OpenAI-compatible format. Today Gemini has its **own native translator**\n  (`kiko_lite/providers/gemini.py`), including thought signatures.\n- It speaks of secrets read like kiko-full. Today keys go to the **OS key stores** (`kikolib/keystore.py`), with env\n  first; the database holds only key names.\n- It speaks of TOML config. Today configuration is **SQLite** (`models`, `model_classes`, `aliases`, `settings`);\n  a one-time `import` reads an old `kiko.yaml` with `kikolib/yaml_lite.py`.\n- It says Anthropic itself is not a provider: still true for the provider table in `providers/__init__.py`\n  (nvidia, groq, dashscope, openai, gemini).\n\nNot verified here: the measurements were provided by the project owner's test runs; they were not re-run for this page.\n"</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
const src = JSON.parse(document.getElementById("md").textContent);
const el = document.getElementById("content");
const r = new marked.Renderer();
r.code = (code, lang) => {
  const t = typeof code === "object" ? code.text : code, l = typeof code === "object" ? code.lang : lang;
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return l === "mermaid" ? '<pre class="mermaid">' + esc + "</pre>" : '<pre><code>' + esc + "</code></pre>";
};
el.innerHTML = marked.parse(src, {renderer: r});
el.querySelectorAll("a[href]").forEach(a => {
  const h = a.getAttribute("href");
  if (/^[A-Za-z0-9_-]+[.]md(#.*)?$/.test(h)) a.setAttribute("href", h.replace(".md", ".html"));
  else if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", "../" + h);  // the html is one folder deeper than the md
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "default"});
const pre = [...el.querySelectorAll("pre.mermaid")];
pre.forEach(p => { p.dataset.src = p.textContent; });
try {
  await mermaid.run({querySelector: "pre.mermaid"});
} catch (e) {
  console.error(e);
} finally {
  // scroll to the #anchor only now: the diagrams change the page height
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
}
// click to enlarge: the overlay always shows the light-theme diagram on white, so it is readable in dark mode too
const lb = document.getElementById("lb");
let n = 0;
pre.forEach(p => {
  const sv = p.querySelector("svg");
  if (!sv) return;
  sv.setAttribute("data-tip", "1");
  p.title = "click to enlarge";
  sv.addEventListener("click", async () => {
    let svg = sv.outerHTML;
    if (dark) {
      try {
        mermaid.initialize({startOnLoad: false, theme: "default"});
        svg = (await mermaid.render("lbd" + (n++), p.dataset.src)).svg;
      } catch (e) {}
      mermaid.initialize({startOnLoad: false, theme: "dark"});
    }
    const t = document.createElement("div");
    t.innerHTML = svg;
    const c = t.querySelector("svg");
    c.removeAttribute("width"); c.removeAttribute("height"); c.style.removeProperty("max-width");
    if (!c.getAttribute("viewBox")) {
      const b = sv.getBBox(); c.setAttribute("viewBox", "0 0 " + b.width + " " + b.height);
    }
    lb.querySelector("svg")?.remove();
    lb.appendChild(c);
    lb.className = "on";
  });
});
lb.addEventListener("click", e => {
  if (e.detail === 1) setTimeout(() => { if (!lb.dataset.z) lb.className = ""; lb.dataset.z = ""; }, 250);
});
lb.addEventListener("dblclick", () => { lb.dataset.z = "1"; lb.className = lb.className === "on big" ? "on" : "on big"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.className = ""; });
</script></body></html>
