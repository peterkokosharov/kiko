<script id="md" type="application/json">"# \u041f\u044a\u0442\u043d\u0430 \u043a\u0430\u0440\u0442\u0430\n\n\u0412\u0441\u0438\u0447\u043a\u043e \u043d\u0430 \u0442\u0430\u0437\u0438 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u0435 **\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e**, \u043e\u0441\u0432\u0435\u043d \u0430\u043a\u043e \u043d\u0435 \u0435 \u043a\u0430\u0437\u0430\u043d\u043e \u0434\u0440\u0443\u0433\u043e.\n\n## Watchdog \u0438 \u043f\u0440\u0435\u0432\u043a\u043b\u044e\u0447\u0432\u0430\u043d\u0435 \u043f\u0440\u0438 \u043e\u0442\u043a\u0430\u0437 (failover) \u0432 \u0440\u0430\u043c\u043a\u0438\u0442\u0435 \u043d\u0430 \u043a\u043b\u0430\u0441 (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e, \u0437\u0430\u0434\u0430\u0447\u0430 #90)\n\n\u0414\u043d\u0435\u0441 kiko-lite \u0438\u0437\u0431\u0438\u0440\u0430 \u043d\u0430\u0439-\u0434\u043e\u0431\u0440\u0438\u044f \u043c\u043e\u0434\u0435\u043b \u043d\u0430 \u043a\u043b\u0430\u0441 \u043e\u0442 \u0431\u0430\u0437\u0430\u0442\u0430 (`Snapshot.best`), \u043d\u043e \u043d\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0432\u0430 \u0434\u0430\u043b\u0438 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u044a\u0442 \u0435 \u0436\u0438\u0432\n\u0438 \u043d\u0435 \u043f\u0440\u0435\u0432\u043a\u043b\u044e\u0447\u0432\u0430 \u043a\u044a\u043c \u0441\u043b\u0435\u0434\u0432\u0430\u0449\u0438\u044f \u043c\u043e\u0434\u0435\u043b \u043d\u0430 \u043a\u043b\u0430\u0441\u0430, \u043a\u043e\u0433\u0430\u0442\u043e \u0435\u0434\u0438\u043d \u0441\u0435 \u0441\u0447\u0443\u043f\u0438. \u0421\u043b\u043e\u044f\u0442 \u0437\u0430 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u0438 \u043e\u043f\u0438\u0442\u0438 (`kikolib/retry.py`)\n\u043f\u043e\u0432\u0442\u0430\u0440\u044f \u043a\u044a\u043c \u0441\u044a\u0449\u0438\u044f \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a \u0441\u0430\u043c\u043e \u043f\u0440\u0438 \u0433\u0440\u0435\u0448\u043a\u0438 429/5xx/\u0433\u0440\u0435\u0448\u043a\u0438 \u043f\u0440\u0438 \u0432\u0440\u044a\u0437\u043a\u0430.\n\n\u0427\u0435\u0441\u0442\u043d\u0430 \u0438\u0441\u0442\u043e\u0440\u0438\u044f: \u043f\u043e-\u0441\u0442\u0430\u0440\u0438\u044f\u0442 kiko-full \u043d\u0430 \u0431\u0430\u0437\u0430\u0442\u0430 \u043d\u0430 LiteLLM \u0438\u043c\u0430\u0448\u0435 \u0444\u043e\u043d\u043e\u0432 \u0446\u0438\u043a\u044a\u043b \u0437\u0430 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043d\u0430 \u0437\u0434\u0440\u0430\u0432\u0435\u0442\u043e (`_health_loop`).\nkiko-lite \u043e\u0449\u0435 \u043d\u044f\u043c\u0430 \u0442\u0430\u043a\u044a\u0432. \u041a\u043e\u043b\u043e\u043d\u0438\u0442\u0435 `models.status` \u0438 `last_check` \u0441\u044a\u0449\u0435\u0441\u0442\u0432\u0443\u0432\u0430\u0442 (\u043a\u043e\u043f\u0438\u0440\u0430\u043d\u0438 \u043e\u0442 kiko-full), \u043d\u043e \u043d\u0438\u0449\u043e \u0432\nkiko-lite \u043d\u0435 \u0433\u0438 \u043f\u0438\u0448\u0435 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e.\n\n\u041f\u043b\u0430\u043d: \u043d\u0438\u0448\u043a\u0430-watchdog \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0432\u0430 (probe) \u0432\u0441\u0435\u043a\u0438 \u0432\u043a\u043b\u044e\u0447\u0435\u043d \u043c\u043e\u0434\u0435\u043b, \u0437\u0430\u043f\u0438\u0441\u0432\u0430 `status` (`ok` / `down`), \u0430 \u0440\u0435\u0437\u043e\u043b\u0432\u0435\u0440\u044a\u0442 \u0432\u0435\u0447\u0435\n\u043f\u0440\u0435\u0434\u043f\u043e\u0447\u0438\u0442\u0430 `ok` \u043f\u0440\u0435\u0434 `unknown`. Failover \u0442\u043e\u0433\u0430\u0432\u0430 \u0437\u043d\u0430\u0447\u0438: \u0430\u043a\u043e \u043d\u0430\u0439-\u0434\u043e\u0431\u0440\u0438\u044f\u0442 \u043c\u043e\u0434\u0435\u043b \u0435 `down`, \u043f\u043e\u043b\u0437\u0432\u0430 \u0441\u0435 \u0441\u043b\u0435\u0434\u0432\u0430\u0449\u0438\u044f\u0442 \u043a\u0430\u043d\u0434\u0438\u0434\u0430\u0442\n\u043e\u0442 \u0441\u044a\u0449\u0438\u044f \u043a\u043b\u0430\u0441 \u043f\u043e `priority`.\n\n```mermaid\nflowchart LR\n    W[\"Watchdog (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e)\"] -->|\"\u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430\"| P[\"\u041c\u043e\u0434\u0435\u043b\u0438 \u043d\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u0430\"]\n    P -->|\"ok / \u0433\u0440\u0435\u0448\u043a\u0430\"| W\n    W -->|\"\u0437\u0430\u043f\u0438\u0441 \u043d\u0430 status\"| DB[(\"models.status\")]\n    R[\"\u0420\u0435\u0437\u043e\u043b\u0432\u044a\u0440\"] -->|\"best(class)\"| DB\n    R --> CH[\"\u0421\u043b\u0435\u0434\u0432\u0430\u0449 \u0436\u0438\u0432 \u043a\u0430\u043d\u0434\u0438\u0434\u0430\u0442 \u043e\u0442 \u043a\u043b\u0430\u0441\u0430\"]\n```\n\n## \u041e\u0431\u043d\u043e\u0432\u044f\u0435\u043c\u0438 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438 (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e, \u0437\u0430\u0434\u0430\u0447\u0430 #91)\n\n\u0414\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438\u0442\u0435 \u0442\u0440\u044f\u0431\u0432\u0430 \u0434\u0430 \u043c\u043e\u0433\u0430\u0442 \u0434\u0430 \u0441\u0435 \u043e\u0431\u043d\u043e\u0432\u044f\u0432\u0430\u0442 \u0431\u0435\u0437 \u043f\u0440\u0435\u0438\u043d\u0441\u0442\u0430\u043b\u0438\u0440\u0430\u043d\u0435 \u043d\u0430 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u0430\u0442\u0430: \u0435\u0434\u0438\u043d \u0438\u043b\u0438 100 \u043d\u0430\u0432\u0435\u0434\u043d\u044a\u0436, \u043f\u0440\u0435\u0437\u0430\u0440\u0435\u0434\u0435\u043d\u0438\n\u0431\u0435\u0437 \u043f\u0440\u0435\u0438\u043d\u0441\u0442\u0430\u043b\u0438\u0440\u0430\u043d\u0435. \u0412\u0441\u0435\u043a\u0438 \u043c\u043e\u0434\u0443\u043b \u0437\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a \u0449\u0435 \u0437\u0430\u043f\u0438\u0441\u0432\u0430 \u043e\u0442 \u043a\u043e\u0439 commit \u043d\u0430 LiteLLM \u0435 \u043f\u0440\u0435\u043d\u0435\u0441\u0435\u043d, \u0437\u0430 \u0434\u0430 \u0437\u043d\u0430\u0435\u043c \u043a\u043e\u0438\n\u043f\u043e\u043f\u0440\u0430\u0432\u043a\u0438 \u043e\u0442 upstream \u0438\u043c\u0430\u043c\u0435 \u0438 \u043a\u043e\u0438 \u043d\u044f\u043c\u0430\u043c\u0435. \u0414\u043d\u0435\u0441 \u0442\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430 \u0441 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438 \u0435 Python dict \u0432\n`kiko_lite/providers/__init__.py`, \u0430 \u0434\u0432\u0430\u0442\u0430 \u043f\u0440\u0435\u0432\u043e\u0434\u0430\u0447\u0430 \u0441\u0430 \u043e\u0431\u0438\u043a\u043d\u043e\u0432\u0435\u043d\u0438 \u043c\u043e\u0434\u0443\u043b\u0438; \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u044a\u043c \u0437\u0430 \u043f\u0440\u0435\u0437\u0430\u0440\u0435\u0436\u0434\u0430\u043d\u0435 \u043d\u044f\u043c\u0430.\n\n## \u041f\u0440\u043e\u0446\u0435\u0434\u0443\u0440\u0430\u0442\u0430 \u0437\u0430 \u043f\u043e\u043f\u0440\u0430\u0432\u043a\u0430, \u0437\u0430\u0434\u0432\u0438\u0436\u0432\u0430\u043d\u0430 \u043e\u0442 \u0441\u044a\u0431\u0438\u0442\u0438\u0435 (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e)\n\nLiteLLM \u0435 \u043a\u043e\u043b\u0435\u043a\u0442\u0438\u0432\u043d\u0438\u044f\u0442 \u043e\u043f\u0438\u0442 \u043d\u0430 \u0441\u0432\u0435\u0442\u0430 \u0441 \u043e\u0441\u043e\u0431\u0435\u043d\u043e\u0441\u0442\u0438\u0442\u0435 \u043d\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438\u0442\u0435. kiko-lite \u043d\u0435 \u0433\u043e \u043a\u043e\u043f\u0438\u0440\u0430; \u043f\u0440\u0435\u043d\u0430\u0441\u044f \u043c\u0430\u043b\u043a\u0438 \u043f\u043e\u043f\u0440\u0430\u0432\u043a\u0438,\n\u043a\u043e\u0433\u0430\u0442\u043e \u043d\u044f\u043a\u043e\u0439 \u043c\u043e\u0434\u0435\u043b \u0441\u0435 \u0441\u0447\u0443\u043f\u0438.\n\n```mermaid\nflowchart TD\n    A[\"\u041c\u043e\u0434\u0435\u043b \u0441\u0435 \u0441\u0447\u0443\u043f\u0432\u0430\"] --> B[\"Watchdog \u0433\u043e \u0432\u0438\u0436\u0434\u0430\"]\n    B --> C[\"\u041c\u0430\u0440\u043a\u0438\u0440\u0430 \u043c\u043e\u0434\u0435\u043b\u0430 \u043a\u0430\u0442\u043e down, failover \u0432 \u0440\u0430\u043c\u043a\u0438\u0442\u0435 \u043d\u0430 \u043a\u043b\u0430\u0441\u0430\"]\n    C --> D[\"\u0418\u0437\u0447\u0430\u043a\u0432\u0430\u043d\u0435 \u043d\u0430 \u043f\u043e\u043f\u0440\u0430\u0432\u043a\u0430 \u0432 LiteLLM\"]\n    D --> E[\"\u041f\u0440\u0435\u043d\u0430\u0441\u044f\u043d\u0435 \u043d\u0430 \u043c\u0430\u043b\u043a\u0430\u0442\u0430 \u043f\u0440\u043e\u043c\u044f\u043d\u0430 \u0432 \u043c\u043e\u0434\u0443\u043b\u0430 \u043d\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u0430\"]\n    E --> F[\"\u0422\u0435\u0441\u0442\"]\n    F --> G[\"\u041f\u0440\u0435\u0433\u043b\u0435\u0434 (\u043e\u0442 \u043f\u043e-\u0441\u0438\u043b\u0435\u043d \u043c\u043e\u0434\u0435\u043b)\"]\n    G --> H[\"\u041f\u0430\u043a\u0435\u0442\u0438\u0440\u0430\u043d\u0435 \u043d\u0430 \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\u0442\u043e \u043d\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u0430\"]\n    H --> I[\"\u0412\u043d\u0435\u0434\u0440\u044f\u0432\u0430\u043d\u0435 - \u043f\u0440\u0435\u0437\u0430\u0440\u0435\u0436\u0434\u0430\u043d\u0435, \u0431\u0435\u0437 \u043f\u0440\u0435\u0438\u043d\u0441\u0442\u0430\u043b\u0438\u0440\u0430\u043d\u0435\"]\n    I --> J[\"Watchdog \u043f\u043e\u0442\u0432\u044a\u0440\u0436\u0434\u0430\u0432\u0430, \u0447\u0435 \u043c\u043e\u0434\u0435\u043b\u044a\u0442 \u0435 \u0436\u0438\u0432\"]\n```\n\n## \u0426\u0435\u043b: \u0440\u0443\u0442\u0435\u0440 (\u043f\u043b\u0430\u043d\u0438\u0440\u0430\u043d\u043e)\n\n\u0415\u0432\u0442\u0438\u043d \u0434\u043e\u043c\u0430\u0448\u0435\u043d \u0440\u0443\u0442\u0435\u0440 \u043c\u043e\u0436\u0435 \u0434\u0430 \u043f\u0443\u0441\u043a\u0430 kiko-lite \u043a\u0430\u0442\u043e \u043f\u043e\u0441\u0442\u043e\u044f\u043d\u043d\u0430 \u0443\u0441\u043b\u0443\u0433\u0430.\n\n| \u0422\u043e\u0447\u043a\u0430 | \u0421\u0442\u043e\u0439\u043d\u043e\u0441\u0442 |\n|---|---|\n| \u0421\u0438\u0441\u0442\u0435\u043c\u0430 | OpenWrt |\n| Python | python3 3.11, 3.13 \u0438\u043b\u0438 3.14 (kiko-lite \u0438\u0441\u043a\u0430 3.11+) |\n| \u041c\u044f\u0441\u0442\u043e | 128 MB \u0438\u043b\u0438 \u043f\u043e\u0432\u0435\u0447\u0435 \u0444\u043b\u0430\u0448, 256 MB \u0438\u043b\u0438 \u043f\u043e\u0432\u0435\u0447\u0435 RAM, \u0438\u043b\u0438 USB \u0444\u043b\u0430\u0448\u043a\u0430 |\n| \u0423\u0441\u043b\u0443\u0433\u0430 | init \u0441\u043a\u0440\u0438\u043f\u0442 \u0437\u0430 `procd` |\n| \u041a\u043b\u044e\u0447\u043e\u0432\u0435 | \u0441\u0440\u0435\u0434\u0430\u0442\u0430 \u0438\u043b\u0438 `.env` \u0434\u043e \u0431\u0430\u0437\u0430\u0442\u0430 (\u043d\u0430 \u0440\u0443\u0442\u0435\u0440 \u043d\u044f\u043c\u0430 \u0434\u0435\u0441\u043a\u0442\u043e\u043f \u0445\u0440\u0430\u043d\u0438\u043b\u0438\u0449\u0435 \u0437\u0430 \u043a\u043b\u044e\u0447\u043e\u0432\u0435) |\n\n\u041d\u0435\u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043e: \u0442\u043e\u0447\u043d\u0438\u044f\u0442 \u043d\u0430\u0431\u043e\u0440 \u043f\u0430\u043a\u0435\u0442\u0438 \u043d\u0430 OpenWrt, \u043f\u0430\u043c\u0435\u0442\u0442\u0430 \u043d\u0430 kiko-lite \u0432\u044a\u0440\u0445\u0443 \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u0430\u0442\u0430 \u043d\u0430 \u0440\u0443\u0442\u0435\u0440\u0430 \u0438 \u0434\u0430\u043b\u0438 \u0432\u0441\u0438\u0447\u043a\u0438 \u043c\u043e\u0434\u0443\u043b\u0438\n\u043d\u0430 \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u0430\u0442\u0430 \u0431\u0438\u0431\u043b\u0438\u043e\u0442\u0435\u043a\u0430, \u043a\u043e\u0438\u0442\u043e kiko-lite \u0438\u043c\u043f\u043e\u0440\u0442\u0438\u0440\u0430 (`sqlite3`, `ssl`, `ctypes`), \u043f\u0440\u0438\u0441\u044a\u0441\u0442\u0432\u0430\u0442 \u0432 \u043f\u0430\u043a\u0435\u0442\u0438\u0442\u0435 \u043d\u0430 Python\n\u0437\u0430 OpenWrt. \u041d\u0443\u0436\u0435\u043d \u0435 \u0442\u0435\u0441\u0442 \u043d\u0430 \u0440\u0435\u0430\u043b\u043d\u043e \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u043e.\n\n## \u0426\u0435\u043b\u0438 \u0437\u0430 Linux\n\nLinux Mint 22.3 \u0438 Q4OS 6 (TDE). \u0425\u0440\u0430\u043d\u0438\u043b\u0438\u0449\u0430\u0442\u0430 \u0437\u0430 \u043a\u043b\u044e\u0447\u043e\u0432\u0435 \u043d\u0430 Linux (secret-tool, KWallet, dcop \u0437\u0430 TDE) \u0441\u0430 \u0432\n`kikolib/keystore.py`; `dcop` \u0435 \u043e\u0442\u0431\u0435\u043b\u044f\u0437\u0430\u043d \u043a\u0430\u0442\u043e \u043d\u0435\u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d \u0432 `kikolib/README.md`, \u0430 `tools/linux_keystore_check.py` \u0438\n`docs/LINUX-KEYSTORE-TEST.md` \u0441\u044a\u0449\u0435\u0441\u0442\u0432\u0443\u0432\u0430\u0442 \u0437\u0430 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430\u0442\u0430 \u0438\u043c \u043d\u0430 \u0440\u0435\u0430\u043b\u043d\u0430 \u043c\u0430\u0448\u0438\u043d\u0430.\n"</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
const src = JSON.parse(document.getElementById("md").textContent);
const el = document.getElementById("content");
const r = new marked.Renderer();
r.code = (code, lang) => {
  const t = typeof code === "object" ? code.text : code, l = typeof code === "object" ? code.lang : lang;
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return l === "mermaid" ? '<pre class="mermaid">' + esc + "</pre>" : '<pre><code>' + esc + "</code></pre>";
};
el.innerHTML = marked.parse(src, {renderer: r});
el.querySelectorAll("a[href]").forEach(a => {
  const h = a.getAttribute("href");
  if (/^[A-Za-z0-9_-]+[.]md(#.*)?$/.test(h)) a.setAttribute("href", h.replace(".md", ".html"));
  else if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", "../" + h);  // the html is one folder deeper than the md
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "default"});
const pre = [...el.querySelectorAll("pre.mermaid")];
pre.forEach(p => { p.dataset.src = p.textContent; });
try {
  await mermaid.run({querySelector: "pre.mermaid"});
} catch (e) {
  console.error(e);
} finally {
  // scroll to the #anchor only now: the diagrams change the page height
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
}
// click to enlarge: the overlay always shows the light-theme diagram on white, so it is readable in dark mode too
const lb = document.getElementById("lb");
let n = 0;
pre.forEach(p => {
  const sv = p.querySelector("svg");
  if (!sv) return;
  sv.setAttribute("data-tip", "1");
  p.title = "кликни за уголемяване";
  sv.addEventListener("click", async () => {
    let svg = sv.outerHTML;
    if (dark) {
      try {
        mermaid.initialize({startOnLoad: false, theme: "default"});
        svg = (await mermaid.render("lbd" + (n++), p.dataset.src)).svg;
      } catch (e) {}
      mermaid.initialize({startOnLoad: false, theme: "dark"});
    }
    const t = document.createElement("div");
    t.innerHTML = svg;
    const c = t.querySelector("svg");
    c.removeAttribute("width"); c.removeAttribute("height"); c.style.removeProperty("max-width");
    if (!c.getAttribute("viewBox")) {
      const b = sv.getBBox(); c.setAttribute("viewBox", "0 0 " + b.width + " " + b.height);
    }
    lb.querySelector("svg")?.remove();
    lb.appendChild(c);
    lb.className = "on";
  });
});
lb.addEventListener("click", e => {
  if (e.detail === 1) setTimeout(() => { if (!lb.dataset.z) lb.className = ""; lb.dataset.z = ""; }, 250);
});
lb.addEventListener("dblclick", () => { lb.dataset.z = "1"; lb.className = lb.className === "on big" ? "on" : "on big"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.className = ""; });
</script></body></html>
