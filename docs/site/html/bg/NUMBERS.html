<script id="md" type="application/json">"# \u0427\u0438\u0441\u043b\u0430\n\nkiko-lite \u0441\u0440\u0435\u0449\u0443 kiko-full \u043d\u0430 \u0431\u0430\u0437\u0430\u0442\u0430 \u043d\u0430 LiteLLM, \u0438\u0437\u043c\u0435\u0440\u0435\u043d\u043e \u043d\u0430 Windows, \u043c\u0435\u0434\u0438\u0430\u043d\u0430 \u043e\u0442 3 \u043f\u0443\u0441\u043a\u0430\u043d\u0438\u044f.\n\n| \u041c\u044f\u0440\u043a\u0430 | kiko-lite | kiko-full (LiteLLM) |\n|---|---|---|\n| Working set | 36.0 MB | 223.2 MB |\n| \u0427\u0430\u0441\u0442\u043d\u0430 \u043f\u0430\u043c\u0435\u0442 | 22.3 MB | 204.1 MB |\n| \u0412\u0440\u0435\u043c\u0435 \u0437\u0430 \u0441\u0442\u0430\u0440\u0442 | 0.4 s | 6.3 s (\u0441\u0442\u0443\u0434\u0435\u043d \u0441\u0442\u0430\u0440\u0442 13.5 s) |\n| \u0417\u0430\u0440\u0435\u0434\u0435\u043d\u0438 \u043c\u043e\u0434\u0443\u043b\u0438 | 214 | 2831 |\n\n\u0417\u0430 \u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u0435, \u0433\u043e\u043b \u0438\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0430\u0442\u043e\u0440 \u043d\u0430 Python \u0438\u043c\u0430 working set 25.5 MB, \u0442.\u0435. kiko-lite \u0434\u043e\u0431\u0430\u0432\u044f \u043e\u043a\u043e\u043b\u043e 10 MB \u043e\u0442\u0433\u043e\u0440\u0435.\n\n```mermaid\nflowchart LR\n    subgraph FULL[\"kiko-full: LiteLLM + FastAPI + \u0444\u0430\u043a\u0442\u0443\u0440\u0438\u0440\u0430\u043d\u0435\"]\n        F1[\"223 MB working set\"]\n        F2[\"6.3 s \u0441\u0442\u0430\u0440\u0442\"]\n        F3[\"2831 \u043c\u043e\u0434\u0443\u043b\u0430\"]\n    end\n    subgraph LITE[\"kiko-lite: \u0441\u0430\u043c\u043e \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u0430 \u0431\u0438\u0431\u043b\u0438\u043e\u0442\u0435\u043a\u0430\"]\n        L1[\"36 MB working set\"]\n        L2[\"0.4 s \u0441\u0442\u0430\u0440\u0442\"]\n        L3[\"214 \u043c\u043e\u0434\u0443\u043b\u0430\"]\n    end\n    FULL -->|\"~85% \u043f\u043e-\u043c\u0430\u043b\u043a\u043e \u043f\u0430\u043c\u0435\u0442\"| LITE\n```\n\n## \u041a\u0430\u043a\u0432\u043e \u0435 \u0438\u0437\u0440\u044f\u0437\u0430\u043d\u043e \u0438 \u0437\u0430\u0449\u043e\n\n\u041f\u044a\u0440\u0432\u0438\u044f\u0442 \u043f\u043b\u0430\u043d (\u0431\u0435\u043b\u0435\u0436\u043a\u0430 \u043e\u0442 2026-10-28) \u0438\u0437\u0431\u0440\u043e\u044f\u0432\u0430\u0448\u0435 \u043a\u0430\u043a\u0432\u043e \u0434\u0430 \u0441\u0435 \u043c\u0430\u0445\u043d\u0435 \u043e\u0442 LiteLLM. \u0420\u0435\u0437\u044e\u043c\u0435, \u0441 \u043e\u0442\u0431\u0435\u043b\u044f\u0437\u0430\u043d\u0438 \u043f\u043e-\u043a\u044a\u0441\u043d\u0438\u0442\u0435 \u043f\u0440\u043e\u043c\u0435\u043d\u0438.\n\n| \u0427\u0430\u0441\u0442 \u043e\u0442 LiteLLM | \u041a\u0430\u043a\u0432\u043e \u043f\u0440\u0430\u0432\u0438 | \u0417\u0430\u0449\u043e \u0435 \u043c\u0430\u0445\u043d\u0430\u0442\u0430 |\n|---|---|---|\n| 147 \u0430\u0434\u0430\u043f\u0442\u0435\u0440\u0430 \u0437\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438 (\u043e\u043a\u043e\u043b\u043e 990 \u0444\u0430\u0439\u043b\u0430) | \u0433\u043e\u0432\u043e\u0440\u044f\u0442 \u0441 \u0432\u0441\u0435\u043a\u0438 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a | \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438\u0442\u0435 \u043d\u0430 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u0438\u043a\u0430 \u0433\u043e\u0432\u043e\u0440\u044f\u0442 OpenAI-\u0441\u044a\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e \u0438\u043b\u0438 Gemini natively; \u0437\u0430\u043f\u0438\u0441 \u0432 \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u0437\u0430\u043c\u0435\u043d\u044f \u043f\u0430\u043f\u043a\u0430 |\n| \u0418\u043d\u0442\u0435\u0433\u0440\u0430\u0446\u0438\u0438 (Langfuse, OpenTelemetry, Datadog, S3, Slack) | \u043b\u043e\u0433\u043e\u0432\u0435 \u0438 \u0438\u0437\u0432\u0435\u0441\u0442\u0438\u044f | \u043b\u043e\u0433\u0432\u0430\u043c\u0435 \u0432 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u0438\u044f \u0441\u0438 SQLite |\n| Proxy \u0441\u044a\u0440\u0432\u044a\u0440 (FastAPI, \u0435\u043a\u0438\u043f\u0438, \u0431\u044e\u0434\u0436\u0435\u0442\u0438, Postgres, SSO, MCP) | \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0438 \u043c\u043d\u043e\u0433\u043e \u043f\u043e\u0442\u0440\u0435\u0431\u0438\u0442\u0435\u043b\u0438 | \u0437\u0430\u043c\u0435\u043d\u0435\u043d \u043e\u0442 `kikolib/server.py`; \u043a\u043b\u044e\u0447\u043e\u0432\u0435\u0442\u0435 \u0438 \u043b\u0438\u043c\u0438\u0442\u0438\u0442\u0435 \u0441\u0430 \u0432 SQLite |\n| Router, \u043a\u0435\u0448\u0438\u0440\u0430\u043d\u0435, scheduler | \u0431\u0430\u043b\u0430\u043d\u0441\u0438\u0440\u0430\u043d\u0435 \u043d\u0430 \u043d\u0430\u0442\u043e\u0432\u0430\u0440\u0432\u0430\u043d\u0435\u0442\u043e, Redis \u043a\u0435\u0448, \u043e\u043f\u0430\u0448\u043a\u0430 | \u0435\u0434\u0438\u043d \u043f\u043e\u0442\u0440\u0435\u0431\u0438\u0442\u0435\u043b; failover \u0449\u0435 \u0435 \u043d\u0430\u0448 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d, \u0432\u0436. [ROADMAP](ROADMAP.md) |\n| \u0414\u0440\u0443\u0433\u0438 API (assistants, batches, files, images, rerank, ...) | \u043a\u0440\u0430\u0439\u043d\u0438 \u0442\u043e\u0447\u043a\u0438 \u0437\u0430 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 | Claude Code \u043f\u043e\u043b\u0437\u0432\u0430 \u0441\u0430\u043c\u043e `/v1/messages` \u0438 `count_tokens` |\n| \u0414\u043e\u043f\u044a\u043b\u043d\u0438\u0442\u0435\u043b\u043d\u0438 \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0438 (`/v1/chat/completions`, `/v1/embeddings`, ...) | \u043f\u0440\u0435\u0432\u0435\u0434\u0435\u043d\u0438 \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0438 | \u0437\u0430\u0441\u0435\u0433\u0430 \u043d\u0435 \u0441\u0430 \u0432 kiko-lite |\n| \u0410\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u0435\u043d \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441 (\u043e\u043a\u043e\u043b\u043e 2 270 \u0444\u0430\u0439\u043b\u0430) | \u0442\u0430\u0431\u043b\u043e | \u0432\u043c\u0435\u0441\u0442\u043e \u043d\u0435\u0433\u043e: `doctor`, `costs` \u0438 SQLite |\n| \u0422\u0435\u0441\u0442\u043e\u0432\u0435 \u043d\u0430 LiteLLM (\u043e\u043a\u043e\u043b\u043e 4 000 \u0444\u0430\u0439\u043b\u0430) | \u0442\u0435\u0441\u0442\u043e\u0432\u0435 \u043d\u0430 \u0433\u043e\u0440\u043d\u043e\u0442\u043e | \u0438\u0437\u0447\u0435\u0437\u0432\u0430\u0442 \u0437\u0430\u0435\u0434\u043d\u043e \u0441 \u043a\u043e\u0434\u0430 |\n| \u0422\u0435\u0436\u043a\u0438 \u043f\u0430\u043a\u0435\u0442\u0438 (httpx, aiohttp, openai, pydantic, fastapi, uvicorn, pyyaml, tiktoken, ...) | HTTP, \u0441\u044a\u0440\u0432\u044a\u0440, \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044f, \u0442\u043e\u043a\u0435\u043d\u0438 | \u0437\u0430\u043c\u0435\u043d\u0435\u043d\u0438 \u043e\u0442 `http.client`, `ssl`, `http.server`, `sqlite3`, `json`; \u0431\u0440\u043e\u044f\u0442 \u0442\u043e\u043a\u0435\u043d\u0438 \u0438\u0434\u0432\u0430 \u043e\u0442 `usage` \u043d\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a\u0430 |\n\n## \u041a\u0430\u043a\u0432\u043e \u0432 \u0441\u0442\u0430\u0440\u0430\u0442\u0430 \u0431\u0435\u043b\u0435\u0436\u043a\u0430 \u0432\u0435\u0447\u0435 \u0435 \u043e\u0441\u0442\u0430\u0440\u044f\u043b\u043e\n\n\u0411\u0435\u043b\u0435\u0436\u043a\u0430\u0442\u0430 \u0441\u044a\u0441 \u0441\u043f\u0438\u0441\u044a\u043a\u0430 \u0437\u0430 \u0440\u044f\u0437\u0430\u043d\u0435 \u0435 \u043f\u0438\u0441\u0430\u043d\u0430 \u043f\u0440\u0435\u0434\u0438 \u043d\u044f\u043a\u043e\u043b\u043a\u043e \u0440\u0435\u0448\u0435\u043d\u0438\u044f. \u041a\u044a\u0434\u0435\u0442\u043e \u0441\u0435 \u0440\u0430\u0437\u043b\u0438\u0447\u0430\u0432\u0430 \u043e\u0442 \u043a\u043e\u0434\u0430, \u043f\u0440\u0430\u0432 \u0435 \u043a\u043e\u0434\u044a\u0442:\n\n- \u0422\u044f \u043a\u0430\u0437\u0432\u0430, \u0447\u0435 \u0434\u043e Gemini \u0441\u0435 \u0441\u0442\u0438\u0433\u0430 \u043f\u0440\u0435\u0437 OpenAI-\u0441\u044a\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u0438\u044f \u0444\u043e\u0440\u043c\u0430\u0442. \u0414\u043d\u0435\u0441 Gemini \u0438\u043c\u0430 **\u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d \u0440\u043e\u0434\u0435\u043d \u043f\u0440\u0435\u0432\u043e\u0434\u0430\u0447**\n  (`kiko_lite/providers/gemini.py`), \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u043b\u043d\u043e thought signatures.\n- \u0422\u044f \u0433\u043e\u0432\u043e\u0440\u0438 \u0437\u0430 \u0442\u0430\u0439\u043d\u0438, \u0447\u0435\u0442\u0435\u043d\u0438 \u043a\u0430\u0442\u043e \u0432 kiko-full. \u0414\u043d\u0435\u0441 \u043a\u043b\u044e\u0447\u043e\u0432\u0435\u0442\u0435 \u043e\u0442\u0438\u0432\u0430\u0442 \u0432 **\u0445\u0440\u0430\u043d\u0438\u043b\u0438\u0449\u0430\u0442\u0430 \u0437\u0430 \u043a\u043b\u044e\u0447\u043e\u0432\u0435 \u043d\u0430 \u041e\u0421**\n  (`kikolib/keystore.py`), \u043a\u0430\u0442\u043e \u043f\u044a\u0440\u0432\u043e \u0441\u0435 \u0433\u043b\u0435\u0434\u0430 \u0441\u0440\u0435\u0434\u0430\u0442\u0430; \u0431\u0430\u0437\u0430\u0442\u0430 \u043f\u0430\u0437\u0438 \u0441\u0430\u043c\u043e \u0438\u043c\u0435\u043d\u0430 \u043d\u0430 \u043a\u043b\u044e\u0447\u043e\u0432\u0435.\n- \u0422\u044f \u0433\u043e\u0432\u043e\u0440\u0438 \u0437\u0430 TOML \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044f. \u0414\u043d\u0435\u0441 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044f\u0442\u0430 \u0435 **SQLite** (`models`, `model_classes`, `aliases`, `settings`);\n  \u0435\u0434\u043d\u043e\u043a\u0440\u0430\u0442\u0435\u043d `import` \u0447\u0435\u0442\u0435 \u0441\u0442\u0430\u0440 `kiko.yaml` \u0447\u0440\u0435\u0437 `kikolib/yaml_lite.py`.\n- \u0422\u044f \u043a\u0430\u0437\u0432\u0430, \u0447\u0435 \u0441\u0430\u043c\u0438\u044f\u0442 Anthropic \u043d\u0435 \u0435 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u043a: \u0442\u043e\u0432\u0430 \u043e\u0449\u0435 \u0432\u0430\u0436\u0438 \u0437\u0430 \u0442\u0430\u0431\u043b\u0438\u0446\u0430\u0442\u0430 \u0441 \u0434\u043e\u0441\u0442\u0430\u0432\u0447\u0438\u0446\u0438 \u0432 `providers/__init__.py`\n  (nvidia, groq, dashscope, openai, gemini).\n\n\u041d\u0435\u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043e \u0442\u0443\u043a: \u0438\u0437\u043c\u0435\u0440\u0432\u0430\u043d\u0438\u044f\u0442\u0430 \u0441\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u0435\u043d\u0438 \u043e\u0442 \u0442\u0435\u0441\u0442\u043e\u0432\u0438\u0442\u0435 \u043f\u0443\u0441\u043a\u0430\u043d\u0438\u044f \u043d\u0430 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u0438\u043a\u0430 \u043d\u0430 \u043f\u0440\u043e\u0435\u043a\u0442\u0430; \u043d\u0435 \u0441\u0430 \u043f\u0443\u0441\u043a\u0430\u043d\u0438 \u043d\u0430\u043d\u043e\u0432\u043e \u0437\u0430 \u0442\u0430\u0437\u0438 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430.\n"</script>

  const h = a.getAttribute("href");
  if (/^[A-Za-z0-9_-]+[.]md(#.*)?$/.test(h)) a.setAttribute("href", h.replace(".md", ".html"));
  else if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", "../" + h);  // the html is one folder deeper than the md
});
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad: false, theme: dark ? "dark" : "default"});
const pre = [...el.querySelectorAll("pre.mermaid")];
pre.forEach(p => { p.dataset.src = p.textContent; });
try {
  await mermaid.run({querySelector: "pre.mermaid"});
} catch (e) {
  console.error(e);
} finally {
  // scroll to the #anchor only now: the diagrams change the page height
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
}
// click to enlarge: the overlay always shows the light-theme diagram on white, so it is readable in dark mode too
const lb = document.getElementById("lb");
let n = 0;
pre.forEach(p => {
  const sv = p.querySelector("svg");
  if (!sv) return;
  sv.setAttribute("data-tip", "1");
  p.title = "кликни за уголемяване";
  sv.addEventListener("click", async () => {
    let svg = sv.outerHTML;
    if (dark) {
      try {
        mermaid.initialize({startOnLoad: false, theme: "default"});
        svg = (await mermaid.render("lbd" + (n++), p.dataset.src)).svg;
      } catch (e) {}
      mermaid.initialize({startOnLoad: false, theme: "dark"});
    }
    const t = document.createElement("div");
    t.innerHTML = svg;
    const c = t.querySelector("svg");
    c.removeAttribute("width"); c.removeAttribute("height"); c.style.removeProperty("max-width");
    if (!c.getAttribute("viewBox")) {
      const b = sv.getBBox(); c.setAttribute("viewBox", "0 0 " + b.width + " " + b.height);
    }
    lb.querySelector("svg")?.remove();
    lb.appendChild(c);
    lb.className = "on";
  });
});
lb.addEventListener("click", e => {
  if (e.detail === 1) setTimeout(() => { if (!lb.dataset.z) lb.className = ""; lb.dataset.z = ""; }, 250);
});
lb.addEventListener("dblclick", () => { lb.dataset.z = "1"; lb.className = lb.className === "on big" ? "on" : "on big"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.className = ""; });
</script></body></html>
