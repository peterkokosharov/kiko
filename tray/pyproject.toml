[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiko-tray"
version = "0.1.0"
description = "KIKO system tray manager for Windows"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.scripts]
kiko-tray = "kiko_tray:main"

[tool.hatch.build.targets.wheel]
include = ["kiko_tray.py"]
